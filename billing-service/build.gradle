plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.6'
}

group = 'com.pm'
version = '0.0.1-SNAPSHOT'
description = 'billing-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // gRPC + Protobuf
    implementation 'io.grpc:grpc-netty-shaded:1.79.0'
    implementation 'io.grpc:grpc-protobuf:1.79.0'
    implementation 'io.grpc:grpc-stub:1.79.0'
    implementation 'com.google.protobuf:protobuf-java:4.34.0'

    // Misc
    implementation 'org.apache.tomcat:tomcat-annotations-api:11.0.18'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
}

tasks.named('test') {
    useJUnitPlatform()
}

/**
 * 🔑 Critical fix:
 * Prevent protobuf from trying to resolve Spring Boot dependencies
 */
configurations {
    compileProtoPath {
        extendsFrom = []
    }
}


