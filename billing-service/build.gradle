plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.6'
}

group = 'com.pm'
version = '0.0.1-SNAPSHOT'
description = 'billing-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly 'org.projectlombok:lombok:1.18.48'          // annotations visible while compiling
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // gRPC + Protobuf
    implementation 'io.grpc:grpc-netty-shaded:1.85.1'
    implementation 'io.grpc:grpc-protobuf:1.85.1'
    implementation 'io.grpc:grpc-stub:1.85.1'
    implementation 'com.google.protobuf:protobuf-java:4.36.2'

    // Misc
    implementation 'org.apache.tomcat:tomcat-annotations-api:11.0.27'
// Source: https://mvnrepository.com/artifact/jakarta.annotation/jakarta.annotation-api
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    implementation 'net.devh:grpc-spring-boot-starter:3.1.0.RELEASE'
}

tasks.named('test') {
    useJUnitPlatform()
}

/**
 * 🔑 Critical fix:
 * Prevent protobuf from trying to resolve Spring Boot dependencies
 */
configurations {
    compileProtoPath {
        extendsFrom = []
    }
}


protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.36.2"
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.85.1"
        }
    }

    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
            task.builtins {
                java {}
            }
        }
    }
}