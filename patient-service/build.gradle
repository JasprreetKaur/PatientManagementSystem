plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.6'
}

group = 'com.pm'
version = '0.0.1-SNAPSHOT'
description = 'patient-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    runtimeOnly 'com.h2database:h2'
    implementation 'org.springframework.boot:spring-boot-h2console'
    runtimeOnly 'org.postgresql:postgresql'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // gRPC + protobuf
    // gRPC + protobuf: versions managed by Spring Boot
    implementation 'io.grpc:grpc-netty-shaded'
    implementation 'io.grpc:grpc-protobuf'
    implementation 'io.grpc:grpc-stub'

    compileOnly 'org.projectlombok:lombok:1.18.48'          // annotations visible while compiling
    annotationProcessor 'org.projectlombok:lombok:1.18.48'  // actually generates the code
//    implementation 'io.swagger.core.v3:swagger-annotations:2.2.55'
// Source: https://mvnrepository.com/artifact/jakarta.annotation/jakarta.annotation-api
//    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
// Source: https://mvnrepository.com/artifact/org.springframework.kafka/spring-kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka'}

//tasks.named('test') {
//    useJUnitPlatform()
//}

configurations {
    compileProtoPath {
        extendsFrom = []
    }
}

protobuf {
    plugins {
        grpc {}
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins { grpc {} }
        }
    }
}

